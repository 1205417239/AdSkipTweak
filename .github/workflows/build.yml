name: Build AdSkipTweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        brew install ldid xz
        git clone --recursive https://github.com/theos/theos.git $THEOS
        curl -L https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
        tar -xzf /tmp/sdks.tar.gz -C /tmp
        cp -r /tmp/sdks-master/*.sdk $THEOS/sdks/
        echo "THEOS=$THEOS" >> $GITHUB_ENV
      env:
        THEOS: ${{ github.workspace }}/theos

    - name: Build
      run: |
        export THEOS=${{ github.workspace }}/theos
        make clean package FINALPACKAGE=1
      env:
        THEOS: ${{ github.workspace }}/theos

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AdSkipTweak-build
        path: |
          packages/*.deb
          *.dylib
        if-no-files-found: error
